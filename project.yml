name: DreamLifeHouse
# BEFORE APP STORE UPLOAD: replace com.example.dreamlifehouse with your own
# bundle identifier (registered in your Apple Developer account) and set
# DEVELOPMENT_TEAM to your 10-character Team ID. Build with Xcode 26+.
options:
  bundleIdPrefix: com.birolseker
  deploymentTarget:
    iOS: '17.0'
targets:
  DreamLifeHouse:
    type: application
    platform: iOS
    sources: [DreamLifeHouse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.birolseker.dreamlifehouse
        DEVELOPMENT_TEAM: 5WM9HB4Y66
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.0'  # App Store's first public version (internal dev build 2.56)
        CURRENT_PROJECT_VERSION: 76
        SWIFT_VERSION: '5.10'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: DreamLifeHouse/Info.plist
      properties:
        CFBundleDisplayName: DreamLife House
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  DreamLifeHouseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DreamLifeHouseTests]
    dependencies:
      - target: DreamLifeHouse
  DreamLifeHouseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DreamLifeHouseUITests]
    dependencies:
      - target: DreamLifeHouse
    settings:
      base:
        SWIFT_VERSION: '5.10'
schemes:
  DreamLifeHouse:
    build:
      targets:
        DreamLifeHouse: all
    test:
      targets:
        - DreamLifeHouseTests
        - DreamLifeHouseUITests
