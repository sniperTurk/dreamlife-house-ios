name: iOS build & App Store upload

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: DreamLifeHouse.xcodeproj
      SCHEME: DreamLifeHouse
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Static checks
        run: python3 Tools/check_house_wiring.py

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          mkdir -p build
          set +e
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$SIM_ID" -only-testing:DreamLifeHouseTests \
            CODE_SIGNING_ALLOWED=NO > build/test.log 2>&1
          STATUS=$?
          grep -E "error:|failed|Executed|\*\* TEST" build/test.log | tail -80
          exit $STATUS

      - name: Check App Store Connect key
        id: key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App Store Connect API key secrets are missing; building without signing only."
          fi

      - name: Build for device (unsigned compile check)
        if: steps.key.outputs.ready != 'true'
        run: |
          mkdir -p build
          set +e
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > build/build.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" build/build.log | tail -80
          exit $STATUS

      - name: Archive (signed via App Store Connect API key)
        if: steps.key.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p build
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          set +e
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DreamLifeHouse.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/archive.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* ARCHIVE" build/archive.log | tail -80
          exit $STATUS

      - name: Export & upload to App Store Connect
        if: steps.key.outputs.ready == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath build/DreamLifeHouse.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
